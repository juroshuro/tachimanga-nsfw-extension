apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

ext {
    appName = "Tachiyomi: ${ext.extName}"
    pkgName = "eu.kanade.tachiyomi.extension.${ext.pkgNameSuffix}"
}

android {
    namespace pkgName
    compileSdk 34

    defaultConfig {
        applicationId pkgName
        minSdk 21
        targetSdk 34
        versionCode ext.extVersionCode
        versionName "1.4.${ext.extVersionCode}"

        manifestPlaceholders = [
            appName: appName,
            extClass: ext.extClass,
            nsfw: ext.isNsfw ? "1" : "0"
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    compileOnly("com.github.tachiyomiorg:extensions-lib:1.4")
    implementation("org.jsoup:jsoup:1.16.2")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0")
}
